
name: Lean / Mathlib

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Generate dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build Zolotarev project
        run: lake build NumberTheoryLean

        
      - name: Build Zolotarev project
        run: lake build NumberTheoryLean

      - name: Compile infrastructure tests
        run: lake env lean tests/Infrastructure.lean

